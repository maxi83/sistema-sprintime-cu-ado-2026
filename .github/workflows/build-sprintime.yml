name: Compilar Sprintime
on:
  push:
    branches:
      - mejoras-devolucion-cunado-2026
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restaurar dependencias
        run: dotnet restore lucho-sprintime.csproj
      - name: Compilar
        run: dotnet build lucho-sprintime.csproj -c Release --no-restore
